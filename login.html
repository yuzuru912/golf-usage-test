<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>高爾夫球場使用狀況</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/webAppStyle.css">
<link rel="stylesheet" href="css/buttonStyle.css">
<link rel="stylesheet" href="css/DateBarStyle.css">
<link rel="apple-touch-icon" sizes="180x180" href="Img\icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="Img\icon-32.png">
<link rel="icon" href="Img\favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="球場使用">
<meta name="mobile-web-app-capable" content="yes">

  <style>
    :root {
      --brand-green: #1c5132;
      --brand-green-light: #3d814d;
      --bg-cream: #f4f6f5;
      --text: #26352d;
      --muted: #718078;
      --border: #d8e4da;
      --max-content-width: 1180px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 8% 90%, rgba(96, 150, 91, 0.20), transparent 30%),
        radial-gradient(circle at 95% 85%, rgba(74, 130, 91, 0.16), transparent 28%),
        var(--bg-cream);
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: var(--brand-green);
      color: #fff;
      box-shadow: 0 2px 10px rgba(28, 81, 50, 0.16);
    }

    .brand {
      width: 100%;
      max-width: var(--max-content-width);
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 18px;
    }

    .login-page {
      min-height: calc(100vh - 64px);
      display: grid;
      place-items: center;
      padding: 48px 32px;
    }

    .login-card {
      width: 100%;
      max-width: 620px;
      padding: 48px 52px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 18px 45px rgba(28, 81, 50, 0.13);
    }

    .golf-icon {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, #397b4a, var(--brand-green));
      color: #fff;
      font-size: 38px;
    }

    .login-card h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 14px 0 38px;
      color: var(--muted);
      text-align: center;
      font-size: 18px;
    }

    .login-card label {
      margin-bottom: 10px;
      font-size: 17px;
      font-weight: 700;
    }

    .input-wrap {
      height: 62px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      transition: 0.2s ease;
    }

    .input-wrap:focus-within {
      border-color: var(--brand-green);
      box-shadow: 0 0 0 4px rgba(28, 81, 50, 0.13);
    }

    .input-icon {
      margin: 0 16px 0 20px;
      color: var(--brand-green);
      font-size: 21px;
    }

    .input-wrap input {
      width: 100%;
      height: 100%;
      padding: 0 14px 0 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 18px;
    }

    .input-wrap input::placeholder {
      color: #9aa39d;
    }

    .login-button {
      width: 100%;
      height: 58px;
      margin-top: 26px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand-green-light), var(--brand-green));
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(28, 81, 50, 0.20);
      transition: 0.18s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(28, 81, 50, 0.25);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:focus-visible {
      outline: 3px solid rgba(28, 81, 50, 0.35);
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .topbar {
        height: 58px;
        padding: 0 16px;
      }

      .brand {
        font-size: 16px;
      }

      .login-page {
        min-height: calc(100vh - 58px);
        place-items: start center;
        padding-top: 56px;
      }

      .login-card {
        padding: 30px 24px;
      }

      .golf-icon {
        width: 64px;
        height: 64px;
        font-size: 30px;
      }

      .login-card h1 {
        font-size: 24px;
      }

      .subtitle {
        margin: 10px 0 30px;
        font-size: 15px;
      }

      .login-card label {
        margin-bottom: 8px;
        font-size: 14px;
      }

      .input-wrap {
        height: 54px;
      }

      .input-icon {
        margin: 0 12px 0 16px;
        font-size: 18px;
      }

      .input-wrap input {
        font-size: 16px;
      }

      .login-button {
        height: 48px;
        margin-top: 22px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header class="sticky-top text-white shadow-sm py-3 header-custom">
    <div class="header-content d-flex align-items-center">
      <div class="brand">
        <div class="brand-icon">⛳</div>
        <span>高爾夫球場使用狀況</span>
      </div>
    </div>
  </header>

  <main class="login-page">
    <section class="login-card">
      <div class="golf-icon">⛳</div>

      <h1>歡迎登入</h1>
      <p class="subtitle">請輸入密碼以查看球場使用狀況</p>

      <form id="loginForm">
        <label for="employeeId">密碼</label>

        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input
            id="employeeId"
            name="employeeId"
            type="text"
            placeholder="請輸入密碼"
            autocomplete="username"
            required
          >
        </div>

        <button class="login-button" type="submit">登入</button>
        

      </form>
    </section>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
      });
    }

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const employeeId = document.getElementById('employeeId').value.trim();

      if (!employeeId) return;

      console.log('登入工號：', employeeId);

      location.href = 'index.html';
    });
  </script>
</body>
</html>
