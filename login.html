<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>高爾夫球場使用狀況</title>
<link rel="manifest" href="manifest.json">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
<link rel="apple-touch-icon" sizes="180x180" href="Img\icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="Img\icon-32.png">
<link rel="icon" href="Img\favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="球場使用">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<header class="topbar">  
    <div class="header-content d-flex align-items-center">
      <div class="brand">
        <div class="brand-icon">⛳</div>
        <span>高爾夫球場使用狀況</span>
      </div>
    </div>
  </header>

  <main class="login-page">
    <section class="login-card">
      <div class="golf-icon">⛳</div>

      <h1>歡迎登入</h1>
      <p class="subtitle">請輸入密碼以查看球場使用狀況</p>

      <form id="loginForm">
        <label for="employeeId">密碼</label>

        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input
            id="employeeId"
            name="employeeId"
            type="text"
            placeholder="請輸入密碼"
            autocomplete="username"
            required
          >
        </div>

        <button class="login-button" type="submit">登入</button>
        

      </form>
    </section>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
      });
    }

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const employeeId = document.getElementById('employeeId').value.trim();

      if (!employeeId) return;

      console.log('登入工號：', employeeId);

      location.href = 'index.html';
    });
  </script>
</body>
</html>
