<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1C5132">
  <title>高爾夫球場使用狀況｜登入</title>

  <style>
    :root {
      --brand-green: #1c5132;
      --brand-green-light: #3d814d;
      --bg-cream: #f4f6f5;
      --text: #26352d;
      --muted: #718078;
      --border: #d8e4da;
      --max-content-width: 420px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 8% 90%, rgba(96, 150, 91, 0.20), transparent 30%),
        radial-gradient(circle at 95% 85%, rgba(74, 130, 91, 0.16), transparent 28%),
        var(--bg-cream);
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: var(--brand-green);
      color: #fff;
      box-shadow: 0 2px 10px rgba(28, 81, 50, 0.16);
    }

    .brand {
      width: 100%;
      max-width: var(--max-content-width);
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto;
      font-size: 18px;
      font-weight: 700;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 18px;
    }

    .login-page {
      min-height: calc(100vh - 64px);
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .login-card {
      width: 100%;
      max-width: var(--max-content-width);
      padding: 34px 30px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 18px 45px rgba(28, 81, 50, 0.13);
    }

    .golf-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, #397b4a, var(--brand-green));
      color: #fff;
      font-size: 30px;
    }

    .login-card h1 {
      margin: 0;
      text-align: center;
      font-size: 24px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
    }

    .login-card label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .input-wrap {
      height: 54px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      transition: 0.2s ease;
    }

    .input-wrap:focus-within {
      border-color: var(--brand-green);
      box-shadow: 0 0 0 4px rgba(28, 81, 50, 0.13);
    }

    .input-icon {
      margin: 0 12px 0 16px;
      color: var(--brand-green);
      font-size: 18px;
    }

    .input-wrap input {
      width: 100%;
      height: 100%;
      padding: 0 14px 0 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }

    .input-wrap input::placeholder {
      color: #9aa39d;
    }

    .login-button {
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand-green-light), var(--brand-green));
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(28, 81, 50, 0.20);
      transition: 0.18s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(28, 81, 50, 0.25);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:focus-visible {
      outline: 3px solid rgba(28, 81, 50, 0.35);
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .topbar {
        height: 58px;
        padding: 0 16px;
      }

      .brand {
        font-size: 16px;
      }

      .login-page {
        min-height: calc(100vh - 58px);
        place-items: start center;
        padding-top: 56px;
      }

      .login-card {
        padding: 30px 24px;
      }

      .login-button {
        height: 48px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">⛳</div>
      <span>高爾夫球場使用狀況</span>
    </div>
  </header>

  <main class="login-page">
    <section class="login-card">
      <div class="golf-icon">⛳</div>

      <h1>歡迎登入</h1>
      <p class="subtitle">請輸入工號以查看球場使用狀況</p>

      <form id="loginForm">
        <label for="employeeId">工號</label>

        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input
            id="employeeId"
            name="employeeId"
            type="text"
            placeholder="請輸入工號"
            autocomplete="username"
            required
          >
        </div>

        <button class="login-button" type="submit">登入</button>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const employeeId = document.getElementById('employeeId').value.trim();

      if (!employeeId) return;

      console.log('登入工號：', employeeId);

      // 驗證成功後導向首頁：
      // location.href = 'index.html';
    });
  </script>
</body>
</html>
