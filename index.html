<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>高爾夫球場使用狀況</title>
<link rel="manifest" href="manifest.json">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/webAppStyle.css">
<link rel="stylesheet" href="css/buttonStyle.css">
<link rel="stylesheet" href="css/DateBarStyle.css">
<link rel="apple-touch-icon" sizes="180x180" href="Img\icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="Img\icon-32.png">
<link rel="icon" href="Img\favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="球場使用">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body class="bg-cream text-dark app-page">
<header class="sticky-top text-white shadow-sm py-3 header-custom">  
  <div class="header-content d-flex align-items-center justify-content-between">
    <div>
      <h1 class="fs-5 fw-bold m-0">⛳ 志聖高爾夫球場</h1>
          <small class="opacity-75" style="font-weight: normal; font-size: 12px;" id="srcNote">資料已更新 --:--</small>
      </div>
   <div class="d-flex align-items-center gap-2">
      <button class="btn btn-light btn-sm rounded-3" id="btnRefresh" aria-label="重新整理">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>
  </div>
</header>

<main class="app-container">
<div class="date-bar-wrapper mb-3"
    data-bs-toggle="modal" data-bs-target="#calModal"
    aria-label="選擇查詢日期">
  <div class="date-text-group">
    <span class="main-date" id="dLabel"></span>
    <span class="sub-date" id="dWeek"></span>
  </div>
  <button type="button" class="btn-date-trigger" id="btnCal"
    data-bs-toggle="modal" data-bs-target="#calModal"
    aria-label="選擇查詢日期">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="5" width="18" height="16" rx="3"/>
      <path d="M8 3v4M16 3v4M3 10h18"/>
    </svg>
  </button>
</div>



<div class="modal fade" id="idleModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered cal-modal-width">
    <div class="modal-content text-center p-3">
      <div class="modal-body">
        <div class="fs-1 mb-2">⏱️</div>
        <h5 class="modal-title mb-2">頁面已閒置過久</h5>
        <p class="text-secondary mb-3">為了確保資料準確，系統將在您關閉此提示後重新整理頁面。</p>
        <button type="button" id="btnReload" class="button-timer">確定並刷新</button>
      </div>
    </div>
  </div>
</div>


  <!-- 球道選擇與搜尋 (移除 container-sm) -->
  <div class="mb-3">
    <div class="d-flex gap-2 overflow-x-auto pb-2" style="scrollbar-width: none;" role="group">
      <input type="radio" class="btn-check" name="course" id="btn-all" value="all" autocomplete="off" checked>
      <label class="chip chip-all text-nowrap" for="btn-all">全部&nbsp;<span class="fw-bold" id="nAll">0</span></label>

      <input type="radio" class="btn-check" name="course" id="btn-std" value="std" autocomplete="off">
      <label class="chip chip-std text-nowrap" for="btn-std">標準球道&nbsp;<span class="fw-bold" id="nStd">0</span></label>

      <input type="radio" class="btn-check" name="course" id="btn-dyn" value="dyn" autocomplete="off">
      <label class="chip chip-dyn text-nowrap" for="btn-dyn">動態球道&nbsp;<span class="fw-bold" id="nDyn">0</span></label>
    </div>
    
    <input class="search form-control rounded-4 mt-2" id="q" type="search" placeholder="搜尋工號或姓名…" autocomplete="off">
  </div>

  <div class="mb-2" id="notice"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<!-- Modal 日曆 -->
<div class="modal fade" id="calModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered cal-modal-width">
    <div class="modal-content shadow border-0 rounded-4">
      <div class="modal-header border-0 pb-0 d-flex justify-content-between align-items-center">
        <button type="button" class="btn btn-sm text-secondary border-0 fs-5" id="mPrev">‹</button>
        <h6 class="modal-title fw-bold mb-0" id="mTitle">—</h6>
        <button type="button" class="btn btn-sm text-secondary border-0 fs-5" id="mNext">›</button>
      </div>
      <div class="modal-body">
        <div id="calGrid" class="d-grid gap-1" style="grid-template-columns: repeat(7, 1fr); text-align: center;"></div>
      </div>
      <div class="modal-footer border-0 pt-0 d-flex justify-content-between">
        <button type="button" class="btn btn-sm btn-link text-decoration-none text-muted p-0 fw-bold" id="calToday">回到今天</button>
        <button type="button" class="btn btn-sm text-white rounded-pill px-3 fw-bold" data-bs-dismiss="modal" style="background: #1C5132;">關閉</button>
      </div>
    </div>
  </div>
</div>



<div class="foot" id="foot">
 <small class="foot" style="font-weight: normal; font-size: 12px;" > Designed and created with care by Charlotte. </small>
</div>
   

<!-- 1. 先載入 jQuery 與 Bootstrap -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app-core.js"></script>
<script src="js/renderer.js"></script>
<script src="js/date-controls.js"></script>
<script src="js/timer.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
    });
  }
</script>
</body>
</html>
